{% extends "base.html" %}
{% block title %}Entrar — Painel{% endblock %}
{% block content %}
<div class="max-w-sm mx-auto px-4 py-20">
  <h1 class="font-display text-2xl text-center mb-1">Painel da loja</h1>
  <p class="text-stone-400 text-sm text-center mb-8">Acesso restrito à administração.</p>
  <form method="post" class="bg-white border border-stone-200 rounded-3xl p-8 space-y-4">
    {% csrf_token %}
    {% if form.errors %}<p class="text-red-600 text-sm text-center">Usuário ou senha inválidos.</p>{% endif %}
    <div>
      <label for="id_username" class="block text-sm font-medium mb-1">Usuário</label>
      <input type="text" name="username" id="id_username" required class="input" autocomplete="username">
    </div>
    <div>
      <label for="id_password" class="block text-sm font-medium mb-1">Senha</label>
      <input type="password" name="password" id="id_password" required class="input" autocomplete="current-password">
    </div>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="w-full bg-primary text-white rounded-full py-2.5 font-medium hover:opacity-90">Entrar</button>
  </form>
</div>
{% endblock %}
